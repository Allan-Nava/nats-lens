name: Publish VSIX

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Package vsix
        run: npm run package
      - name: Find generated vsix
        id: find_vsix
        run: |
          VSIX=$(ls *.vsix | head -n1 || true)
          if [ -z "$VSIX" ]; then echo "No .vsix found"; exit 1; fi
          echo "vsix=$VSIX" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        if: github.event_name == 'push'
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload VSIX to Release (push tag)
        if: github.event_name == 'push'
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_vsix.outputs.vsix }}
          asset_name: ${{ steps.find_vsix.outputs.vsix }}
          asset_content_type: application/octet-stream

      - name: Upload VSIX to Release (published release)
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ steps.find_vsix.outputs.vsix }}
          asset_name: ${{ steps.find_vsix.outputs.vsix }}
          asset_content_type: application/octet-stream

      - name: Publish to Marketplace
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          if [ -z "$VSCE_TOKEN" ]; then echo "VSCE_TOKEN not set"; exit 1; fi
          npx vsce publish --pat "$VSCE_TOKEN"
