name: CI

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install nats-server (for integration tests)
        run: |
          curl -sL https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin --wildcards '*/nats-server'
          nats-server --version
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx @vscode/vsce package
      - name: Upload .vsix to the release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
